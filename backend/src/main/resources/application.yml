server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_lock?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Lcm&3651705}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
        globally_quoted_identifiers: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:LockManageSecretKey2026ForJwtTokenGeneration}
  expiration: ${JWT_EXPIRATION:604800000}

# TTLock Configuration
ttlock:
  client-id: ${TTLOCK_CLIENT_ID:9333a73f92d04e81adc6abcaef81dbba}
  client-secret: ${TTLOCK_CLIENT_SECRET:6ba500a63a1da73b76c415231ff5f4fa}
  api-base-url: ${TTLOCK_API_BASE_URL:https://cnapi.ttlock.com}
  env-prefix: ${TTLOCK_ENV_PREFIX:d}

# WeChat Mini Program Configuration（用于"微信一键登录"）
# 留空则一键登录入口禁用（WxClient 调用会抛业务异常），账号密码登录不受影响
wechat:
  appid: ${WECHAT_APPID:wxfa8330bdeb61518c}
  secret: ${WECHAT_SECRET:0f331bae4d7c10c42b234c4ca5c2e5e8}
  api-base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com}
  # 临时跳过 SSL 证书校验：云托管 runtime JRE 不带 api.weixin.qq.com 所需中间 CA 时
  # 可设为 true，部署完成后务必改回 false。生产禁止开启（MITM 风险）。
  skip-ssl-validate: ${WECHAT_SKIP_SSL_VALIDATE:false}

# SMS Configuration (placeholder, using fixed code 666666)
sms:
  code: ${SMS_CODE:666666}
  expire-seconds: ${SMS_EXPIRE_SECONDS:300}

# App Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 调试敏感信息开关。开启时 GET /api/user/debug/ttlock 会返回当前账号的 TTLock 用户名/密码。
  # 生产环境必须保持 false（默认）。非生产环境通过环境变量 APP_SHOW_DEBUG_CREDENTIALS=true 打开。
  show-debug-credentials: ${APP_SHOW_DEBUG_CREDENTIALS:false}

# Jasypt Configuration
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:mySecretMasterKey123}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
